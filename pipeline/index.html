<h1>Book Pipeline</h1>
<p>Book Pipeline is a small personal tool that moves e-book files between the owner's own Google Drive folders and the owner's own e-book library and e-reader.</p>
<p>It is a single-user, private tool. It is not offered to the public and has no other users.</p>
